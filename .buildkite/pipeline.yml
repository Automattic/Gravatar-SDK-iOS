# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Variables used in this pipeline are defined in `shared-pipeline-vars`, which is `source`'d before calling `buidkite-agent pipeline upload`

agents:
  queue: "mac"
env:
  IMAGE_ID: $IMAGE_ID
  SWIFTFORMAT_VERSION: $SWIFTFORMAT_VERSION

steps:
  #################
  # Lint Source files
  #################
  - group: "Linters"
    steps:
      - label: ":swift: SwiftLint"
        command: swiftlint
        key: swiftlint
        notify:
          - github_commit_status:
              context: "SwiftLint"
        agents:
          queue: "linter"

      - label: ":swift: SwiftFormat Linting"
        key: swiftformat-lint
        plugins:
          - docker#v5.12.0:
              image: "ghcr.io/nicklockwood/swiftformat:$SWIFTFORMAT_VERSION"
              command: ["Sources", "Tests", "--lint"]
              workdir: "${BUILDKITE_BUILD_CHECKOUT_PATH}"
        notify:
          - github_commit_status:
              context: "SwiftFormat Linting"
        agents:
          queue: "default"

      - label: ":danger: Danger - PR Check"
        command: danger
        key: danger
        if: build.pull_request.id != null
        retry:
          manual:
            permit_on_passed: true
        notify:
          - github_commit_status:
              context: "Danger - PR Check"
        agents:
          queue: linter

  #################
  # Build and Test
  #################
  - label: "📦 Build and Test Swift Package"
    key: "test"
    command: |
      install_swiftpm_dependencies --use-spm
      validate_swift_package
    plugins: [$CI_TOOLKIT]
    notify:
      - github_commit_status:
          context: "Build and Test Swift Package"

  ###################
  # Prototype Builds of Demo Projects
  ###################
  - group: ":firebase: Prototype Build"
    steps:
      # On PRs, build and share the Demo only on request, so that a Mac doesn't do it for every push.
      # On trunk, the input is skipped, which Buildkite treats as satisfied, so the Demo still builds.
      # On PRs, these steps post no `github_commit_status`: it would post "pending" while they wait for
      # the input, and leave those checks pending on every PR where nobody asks for a prototype.
      - input: "Deploy Prototype Build?"
        prompt: "Build the Demo app and share it via Firebase App Distribution?"
        key: prototype_triggered
        if: build.pull_request.id != null
      - label: "🛠️ Build Demo"
        key: build_demo
        depends_on:
          - test
          - prototype_triggered
        plugins: [$CI_TOOLKIT]
        command: .buildkite/commands/build-demo.sh
        artifact_paths:
          - ".build/artifacts/*.ipa"
          - ".build/artifacts/*.dSYM.zip"
        notify:
          - github_commit_status:
              context: "Build Prototype"
            if: build.pull_request.id == null

      - label: "⬆️ Upload Demo to Firebase App Distribution"
        depends_on: build_demo
        plugins: [$CI_TOOLKIT]
        command: .buildkite/commands/upload-demo-to-firebase.sh
        if: build.pull_request.id != null
